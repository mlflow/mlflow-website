<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="764" viewBox="0 0 1400 764" role="img" aria-labelledby="title description">
  <title id="title">Decision models as judges</title>
  <desc id="description">Editorial illustration comparing Jev, OpenAI Decisions, OpenJev, and Laya for one MLflow evaluation question.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#3e6886" stroke-width="1" opacity="0.12"/>
    </pattern>
    <clipPath id="board-clip">
      <rect x="710" y="87" width="622" height="592" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1400" height="764" fill="#061625"/>
  <rect width="1400" height="764" fill="url(#grid)"/>
  <ellipse cx="1100" cy="160" rx="530" ry="340" fill="#0b5f90" opacity="0.12"/>
  <ellipse cx="1270" cy="690" rx="420" ry="260" fill="#a54e27" opacity="0.09"/>
  <path d="M0 714C360 602 688 608 1400 708" fill="none" stroke="#1d4c72" stroke-width="1" opacity="0.38"/>
  <path d="M0 743C500 617 849 670 1400 748" fill="none" stroke="#1d4c72" stroke-width="1" opacity="0.27"/>
  <path d="M0 60H528" stroke="#195476" stroke-width="2" opacity="0.35"/>
  <path d="M1080 0L1400 264M1190 0L1400 170" stroke="#35c6fa" stroke-width="2" opacity="0.05"/>

  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <rect x="82" y="91" width="253" height="42" rx="21" fill="#102f46" stroke="#2489b6" stroke-opacity="0.75"/>
    <circle cx="105" cy="112" r="5" fill="#4bddff"/>
    <text x="124" y="118" fill="#83ddf8" font-size="17" font-weight="700">MLFLOW EVALUATION</text>

    <text x="78" y="246" fill="#f3fbff" font-size="70" font-weight="750">Decision models</text>
    <text x="78" y="332" fill="#f3fbff" font-size="70" font-weight="750">as judges</text>
    <rect x="81" y="367" width="126" height="5" rx="2.5" fill="#41ccf7"/>
    <rect x="213" y="367" width="43" height="5" rx="2.5" fill="#f39c70"/>

    <text x="82" y="428" fill="#b8d1e3" font-size="27" font-weight="400">Four models. One evaluation question.</text>

    <rect x="82" y="506" width="563" height="103" rx="17" fill="#102b41" fill-opacity="0.76" stroke="#39718f" stroke-opacity="0.68"/>
    <circle cx="128" cy="557.5" r="23" fill="#133d58" stroke="#46c8ee" stroke-width="2"/>
    <text x="121" y="568" fill="#8eeaff" font-size="30" font-weight="650">?</text>
    <text x="171" y="566" fill="#e4f5fb" font-size="29" font-weight="600">Is this answer correct?</text>

    <text x="82" y="687" fill="#7ea0b7" font-size="16" font-weight="650">DECISION MODEL COMPARISON</text>
  </g>

  <path d="M646 558H692" stroke="#3ac9f5" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
  <path d="M646 558H711" stroke="#4cdbff" stroke-width="2" stroke-linecap="round" opacity="0.86"/>

  <rect x="722" y="103" width="622" height="592" rx="30" fill="#000711" opacity="0.46"/>
  <rect x="710" y="87" width="622" height="592" rx="30" fill="#0a2134" stroke="#3979a1" stroke-width="2"/>
  <g clip-path="url(#board-clip)">
    <path d="M710 89H1332" stroke="#77ddff" stroke-width="4" opacity="0.56"/>
    <path d="M1329 88V679" stroke="#ff995f" stroke-width="3" opacity="0.22"/>
    <ellipse cx="1290" cy="111" rx="210" ry="100" fill="#125c83" opacity="0.14"/>
  </g>

  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="750" y="148" fill="#9fc1d6" font-size="16" font-weight="700">ONE RUBRIC · FOUR ROUTES</text>
    <path d="M750 170H1292" stroke="#315873" stroke-width="1.5"/>

    <rect x="746" y="199" width="270" height="187" rx="19" fill="#122d44" stroke="#387da2" stroke-width="1.5"/>
    <rect x="746" y="199" width="270" height="5" rx="2.5" fill="#39c8ef"/>
    <text x="774" y="246" fill="#83dfff" font-size="15" font-weight="750">HOSTED</text>
    <text x="774" y="312" fill="#f5fcff" font-size="41" font-weight="700">Jev</text>
    <text x="774" y="348" fill="#9fb9cb" font-size="17">TypeSafe System One</text>

    <rect x="1030" y="199" width="270" height="187" rx="19" fill="#122d44" stroke="#387da2" stroke-width="1.5"/>
    <rect x="1030" y="199" width="270" height="5" rx="2.5" fill="#39c8ef"/>
    <text x="1058" y="246" fill="#83dfff" font-size="15" font-weight="750">HOSTED</text>
    <text x="1058" y="299" fill="#f5fcff" font-size="31" font-weight="700">OpenAI</text>
    <text x="1058" y="334" fill="#f5fcff" font-size="31" font-weight="700">Decisions</text>

    <rect x="746" y="405" width="270" height="187" rx="19" fill="#122d44" stroke="#9a654d" stroke-width="1.5"/>
    <rect x="746" y="405" width="270" height="5" rx="2.5" fill="#f29b6e"/>
    <text x="774" y="452" fill="#f7b38f" font-size="15" font-weight="750">OPEN WEIGHTS</text>
    <text x="774" y="518" fill="#f5fcff" font-size="37" font-weight="700">OpenJev</text>
    <text x="774" y="554" fill="#aab9c4" font-size="17">System One compatible</text>

    <rect x="1030" y="405" width="270" height="187" rx="19" fill="#122d44" stroke="#9a654d" stroke-width="1.5"/>
    <rect x="1030" y="405" width="270" height="5" rx="2.5" fill="#f29b6e"/>
    <text x="1058" y="452" fill="#f7b38f" font-size="15" font-weight="750">OPEN WEIGHTS</text>
    <text x="1058" y="518" fill="#f5fcff" font-size="41" font-weight="700">Laya</text>
    <text x="1058" y="554" fill="#aab9c4" font-size="17">Typed decisions</text>

    <circle cx="770" cy="638" r="4" fill="#59d7fd"/>
    <path d="M785 638H1260" stroke="#315873" stroke-width="1.5"/>
    <circle cx="1277" cy="638" r="4" fill="#ffa373"/>
  </g>
